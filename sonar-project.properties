# Local SonarQube analysis for PWAscore (plumbus.local:9001).
#
# Local gate only: GitHub runners cannot resolve plumbus.local. The token is
# deliberately absent; SONAR_TOKEN comes from the environment, or from fnox via
# `pnpm run sonar:scan`.
#
# The scanner is a JVM process. Test `plumbus.local` first; only if it reports
# NoRouteToHostException while curl succeeds against the same name, rerun with
# the IPv4 literal:
#
#   SONAR_HOST_URL=http://10.0.0.50:9001 pnpm run sonar:scan
#
sonar.projectKey=PWAscore
sonar.projectName=PWAscore
sonar.host.url=http://plumbus.local:9001

# Shipped application code. `scripts/` is build/data tooling and stays out, as
# do generated trees (`.nuxt`, `.output`, `coverage`, `.scannerwork`), which sit
# outside these roots. Tests are excluded as sources: S2699 cannot see Vitest
# assertions reliably, and tests must not move the coverage ratio. They still
# run and their coverage maps onto the production lines below.
sonar.sources=app,server
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/*.d.ts,app/data/**/*.json

# `pnpm run test:coverage` writes this before SonarScanner runs.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# A green scanner run must mean a green gate: wait for processing, then fail
# the scan when the gate fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.json
